<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512" role="img" aria-label="데브마루 아이콘: 마루판처럼 쌓인 서버 위에 터미널 프롬프트가 켜진 모양">
  <title>데브마루</title>
  <!-- 바닥 그림자 -->
  <ellipse cx="128" cy="232" rx="82" ry="8" fill="#000" opacity=".12"/>
  <!-- 받침 다리 -->
  <rect x="62" y="206" width="16" height="18" rx="4" fill="#111"/><rect x="178" y="206" width="16" height="18" rx="4" fill="#111"/>
  <!-- 아래 마루판 서버 -->
  <rect x="36" y="160" width="184" height="48" rx="14" fill="#EBC98E" stroke="#111" stroke-width="6"/>
  <path d="M52 178 q14 -5 28 0 M96 196 h26 M130 196 h8" fill="none" stroke="#B98B4F" stroke-width="3" stroke-linecap="round"/>
  <rect x="150" y="176" width="46" height="6" rx="3" fill="#B98B4F"/><rect x="150" y="188" width="30" height="6" rx="3" fill="#B98B4F"/>
  <circle cx="204" cy="184" r="5" fill="#4CC38A" stroke="#111" stroke-width="2.5"/>
  <!-- 가운데 마루판 서버 -->
  <rect x="36" y="108" width="184" height="48" rx="14" fill="#F3D9A8" stroke="#111" stroke-width="6"/>
  <path d="M54 126 q12 -5 26 0 M100 144 h26 M134 144 h8" fill="none" stroke="#B98B4F" stroke-width="3" stroke-linecap="round"/>
  <rect x="150" y="124" width="46" height="6" rx="3" fill="#B98B4F"/><rect x="150" y="136" width="30" height="6" rx="3" fill="#B98B4F"/>
  <circle cx="204" cy="132" r="5" fill="#FFD23F" stroke="#111" stroke-width="2.5"/>
  <!-- 맨 위: 터미널 화면 -->
  <rect x="36" y="38" width="184" height="66" rx="14" fill="#1B1F24" stroke="#111" stroke-width="6"/>
  <circle cx="54" cy="53" r="4.5" fill="#FF6B6B"/><circle cx="68" cy="53" r="4.5" fill="#FFD23F"/><circle cx="82" cy="53" r="4.5" fill="#4CC38A"/>
  <path d="M56 70 l20 12 l-20 12" fill="none" stroke="#FFD23F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="88" y="86" width="34" height="9" rx="3" fill="#FFD23F"/>
  <rect x="134" y="86" width="10" height="9" rx="2" fill="#FFF6E0" opacity=".9"/>
  <!-- 반짝이 -->
  <path d="M232 36 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="#FFD23F" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <path d="M22 96 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" fill="#FFD23F" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
