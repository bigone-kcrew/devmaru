services:
  markitdown:
    build:
      context: .
      dockerfile: Dockerfile
    image: @@PFX@@-markitdown:0.1.2
    container_name: markitdown
    restart: unless-stopped

    environment:
      MAX_FILE_MB: "100"

    ports:
      - "127.0.0.1:3410:3410"

    networks:
      - @@PFX@@-service-net
      - @@PFX@@-dev-net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=256m,mode=1777

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3410/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  @@PFX@@-service-net:
    external: true

  @@PFX@@-dev-net:
    external: true
