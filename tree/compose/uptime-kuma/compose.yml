services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6-slim
    container_name: uptime-kuma
    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3001"

    volumes:
      - /srv/@@PFX@@/services/uptime-kuma/data:/app/data

    networks:
      - @@PFX@@-service-net

networks:
  @@PFX@@-service-net:
    external: true
