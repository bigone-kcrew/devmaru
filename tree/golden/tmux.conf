# @@BRAND@@ Golden Image tmux baseline

# -------------------------------------------------------------------
# Prefix
# -------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -------------------------------------------------------------------
# General UX
# -------------------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g status-position bottom
set -g status-interval 5
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# -------------------------------------------------------------------
# Colors: 256 colors + true color (24-bit)
# -------------------------------------------------------------------
# COLORTERM=truecolor 를 넘기지 않는 클라이언트(Paseo 앱 터미널·일부 SSH 클라이언트)에서도 24비트 색을 쓰도록
# xterm*(xterm-256color 등)과 tmux*(tmux 안의 tmux) 터미널에 RGB 기능을 선언한다.
# 24비트 색을 지원하지 않는 터미널에서는 색이 어긋날 수 있다(그 경우 이 두 줄을 지운다).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",tmux*:RGB"

# Do not produce terminal bell noise.
set -g bell-action none
set -g visual-bell off
setw -g monitor-bell off

# -------------------------------------------------------------------
# Keep new windows/panes in the current working directory
# -------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload the Golden Image baseline.
bind r source-file /etc/tmux.conf \; display-message "tmux config reloaded"

# -------------------------------------------------------------------
# Status bar: simple monochrome / gray-white
# -------------------------------------------------------------------
set -g status-style "fg=colour250,bg=colour236"

set -g status-left-length 40
set -g status-left "#[bold] #S #[default]"

set -g status-right-length 80
set -g status-right "#H | %H:%M | %Y-%m-%d "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold][#I:#W]#[default] "
