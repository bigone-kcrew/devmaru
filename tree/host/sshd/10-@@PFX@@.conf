# @@BRAND@@ 회원은 초기 비밀번호로 처음 로그인하고(첫 로그인에서 변경을 강제한다), 이후 SSH 키를 등록해 쓴다.
# 회원 그룹에만 비밀번호 로그인을 허용한다. 그 밖의 계정 설정은 건드리지 않는다.
Match Group @@PFX@@
    PasswordAuthentication yes
# 경계: 회원(관리자 계정 제외)은 ssh 로 호스트 셸을 얻지 못한다 — 모든 로그인·명령이 개발환경 안에서 실행된다.
# 호스트 localhost 서비스로 가는 터널도 막는다. 원격 편집기 등에 포트 전달이 필요하면 이 값을 yes 로 바꾼다(호스트 내부 포트가 열리는 것을 감수).
Match Group @@PFX@@ User *,!@@ADMIN_USER@@
    ForceCommand /opt/@@PFX@@/scripts/@@PFX@@-ssh-entry
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
